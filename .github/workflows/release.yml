name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build ${{ matrix.args }}
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: mirrorlab-${{ matrix.os }}
          path: target/**/release/bundle/**

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;28.2.13676358" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri android build --apk
        working-directory: src-tauri
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - uses: actions/upload-artifact@v4
        with:
          name: mirrorlab-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
