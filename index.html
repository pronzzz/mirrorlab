<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MirrorLab | Reflect Your Vision</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            // Coolors Palette: https://coolors.co/333333-643173-7d5ba6-86a59c-89ce94
            background: '#333333', // Dark Charcoal
            surface: '#3d3d3d',     // Slightly lighter for cards/surfaces
            primary: '#643173',     // Purple
            secondary: '#7d5ba6',   // Light Purple
            accent: '#86a59c',      // Sage
            highlight: '#89ce94',   // Green
            text: '#e0e0e0',        // Off-white text
          },
          animation: {
            'fade-in': 'fadeIn 0.6s ease-out forwards',
            'slide-up': 'slideUp 0.6s ease-out forwards',
            'scale-in': 'scaleIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            scaleIn: {
              '0%': { transform: 'scale(0.9)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #333333;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #333333;
    }

    ::-webkit-scrollbar-thumb {
      background: #643173;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #7d5ba6;
    }

    /* Neumorphism Utilities */
    .neumorphic {
      background: #333333;
      box-shadow:  5px 5px 10px #2b2b2b,
                   -5px -5px 10px #3b3b3b;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .neumorphic-inset {
      background: #333333;
      box-shadow: inset 5px 5px 10px #2b2b2b,
                  inset -5px -5px 10px #3b3b3b;
      border-radius: 12px;
    }
    
    .neumorphic-btn {
        background: #333333;
        box-shadow:  4px 4px 8px #2b2b2b,
                     -4px -4px 8px #3b3b3b;
        color: #e0e0e0;
        transition: all 0.2s ease;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.02);
    }
    
    .neumorphic-btn:hover {
        box-shadow:  6px 6px 12px #2b2b2b,
                     -6px -6px 12px #3b3b3b;
        color: #89ce94;
        transform: translateY(-1px);
    }
    
    .neumorphic-btn:active, .neumorphic-btn.active {
        box-shadow: inset 4px 4px 8px #2b2b2b,
                    inset -4px -4px 8px #3b3b3b;
        color: #86a59c;
        transform: translateY(1px);
    }

    /* Glass Effect (Compatible overlay) */
    .glass-panel {
      background: rgba(51, 51, 51, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
